# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - lanzamientos

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Se nombra el proyecto explícitamente: en la raíz hay dos (la aplicación y el
      # de pruebas). Sin la ruta, el SDK resuelve la solución completa y publicar
      # varios proyectos a una sola carpeta de salida es un error, así que el
      # despliegue se cae antes de llegar a Azure.
      - name: Build with dotnet
        run: dotnet build Plataforma_ventas/Plataforma_ventas.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish Plataforma_ventas/Plataforma_ventas.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E2574C21B53E48AC88CCCAEEE21ACDD6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_56BEFFAD05CF4931B14CEEB29D3E490C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_908BEDB896464E0B8970398BBFBE4016 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lanzamientos'
          slot-name: 'Production'
          package: .
          