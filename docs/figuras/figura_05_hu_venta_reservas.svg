<text x="822" y="249" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#0076E3">PARA</text>
<text x="822" y="263" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">respetar el valor prometido aunque la</text>
<text x="822" y="277" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">lista suba</text>
