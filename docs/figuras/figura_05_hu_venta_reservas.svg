<text x="42" y="148" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#003A70">Listas de precio con</text>
<text x="42" y="165" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#003A70">escalamiento</text>
<text x="42" y="188" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#0076E3">COMO</text>
<text x="42" y="202" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">administrador</text>
<text x="42" y="220" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#0076E3">QUIERO</text>
<text x="42" y="234" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">que la lista suba sola cada cierto</text>
<text x="42" y="248" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">número de ventas</text>
<text x="42" y="266" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#0076E3">PARA</text>
<text x="42" y="280" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">aplicar la política de precios sin</text>
<text x="42" y="294" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">intervención manual</text>
