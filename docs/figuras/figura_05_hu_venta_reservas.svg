<circle cx="762" cy="113" r="6" fill="#1EA851"/>
<text x="432" y="148" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#003A70">Tomar una unidad disponible</text>
<text x="432" y="171" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#0076E3">COMO</text>
<text x="432" y="185" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">asesor</text>
<text x="432" y="203" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#0076E3">QUIERO</text>
<text x="432" y="217" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">marcar como en proceso la unidad que</text>
<text x="432" y="231" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">estoy negociando</text>
<text x="432" y="249" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#0076E3">PARA</text>
<text x="432" y="263" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">que ningún otro asesor la ofrezca al</text>
<text x="432" y="277" font-family="Segoe UI, Arial" font-size="11" fill="#5A6472">mismo tiempo</text>
<line x1="432" y1="336" x2="768" y2="336" stroke="#D6DEE8"/>
