<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Londoño Gómez">
  <rect width="100" height="100" rx="18" fill="#0A6CFF"/>
  <!-- Cubo isométrico blanco (marca Londoño Gómez), con separaciones azules entre caras -->
  <g fill="#ffffff">
    <!-- Cara superior -->
    <path d="M50 12 L85 32 L50 52 L15 32 Z"/>
    <!-- Cara izquierda -->
    <path d="M15 35 L48 53.5 L48 86 L15 67.5 Z"/>
    <!-- Cara derecha con muesca interior que insinúa la "G" -->
    <path d="M52 53.5 L85 35 L85 67.5 L52 86 L52 70 L69 60.5 L69 54.5 Z"/>
  </g>
</svg>
